openapi: 3.1.0
info:
  title: MCP Human Approval Gateway
  version: 0.1.0
  description: Synthetic research API for deterministic policy and human approval.
servers:
  - url: http://localhost:4174
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Gateway health and synthetic-data marker
  /api/scenarios:
    get:
      operationId: listScenarios
      responses:
        "200":
          description: Synthetic scenarios and registered tools
  /api/requests:
    get:
      operationId: listRequests
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 250
      responses:
        "200":
          description: Requests ordered newest first
    post:
      operationId: submitRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [scenarioId]
                  properties:
                    scenarioId:
                      type: string
                - $ref: "#/components/schemas/ToolRequest"
      responses:
        "201":
          description: Policy-evaluated request
        "400":
          description: Invalid or unknown scenario
        "415":
          description: JSON content type required
  /api/requests/{requestId}:
    get:
      operationId: getRequest
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Request with decisions
        "404":
          description: Request not found
  /api/requests/{requestId}/decision:
    post:
      operationId: recordDecision
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HumanDecision"
      responses:
        "200":
          description: Committed human decision
        "404":
          description: Request not found
        "409":
          description: Invalid state, insufficient role or version conflict
  /api/requests/{requestId}/execute:
    post:
      operationId: executeSyntheticAction
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestHash:
                  type: string
                  description: SHA-256 the caller expects the approval to be bound to. Must match.
                actorId:
                  type: string
                  description: Requester the caller claims to be. Must match the request.
                idempotencyKey:
                  type: string
                  pattern: "^[A-Za-z0-9._:-]{8,128}$"
                  description: >
                    Caller-chosen key. Repeating the call with the same key returns the
                    recorded outcome (`replayed: true`) and never dispatches again.
                executionId:
                  type: string
                  description: Alternative to the key when retrying a call that already reserved.
              additionalProperties: false
      responses:
        "200":
          description: Execution record. `execution.state` is executing, executed or failed.
        "404":
          description: Request not found
        "409":
          description: One of not_authorized, authorization_expired, replay_blocked, binding_mismatch, actor_mismatch, integrity_failed or version_conflict
  /api/requests/{requestId}/reserve:
    post:
      operationId: reserveExecution
      description: Phase one only. Consumes the grant and returns an executionId and a dispatch key. Same body as execute.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Reservation, state executing
        "409":
          description: Same refusal codes as execute
  /api/executions/{executionId}:
    get:
      operationId: getExecution
      description: State (executing, executed, failed, unknown_outcome) and result digest. A reservation older than the timeout is settled to unknown_outcome on read.
      responses:
        "200":
          description: Execution record
        "404":
          description: Not found
  /api/executions/{executionId}/confirm:
    post:
      operationId: confirmExecution
      description: Phase three. Needs the dispatch key. Records executed (with a result digest) or failed. Trusted in demo mode.
      responses:
        "200":
          description: Updated execution record
        "409":
          description: confirm_rejected, invalid_state or needs_reconciliation
  /api/executions/{executionId}/reconcile:
    post:
      operationId: reconcileExecution
      description: A reviewer records what really happened to an unknown_outcome execution, with a reason. Audited. The requester cannot reconcile their own call.
      responses:
        "200":
          description: Updated execution record
        "409":
          description: invalid_state, self_reconcile or insufficient_role
  /api/audit:
    get:
      operationId: listAuditEvents
      parameters:
        - in: query
          name: requestId
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 1000
      responses:
        "200":
          description: Audit events ordered newest first
  /api/audit/verify:
    get:
      operationId: verifyAuditChain
      parameters:
        - in: query
          name: anchorSequence
          schema:
            type: integer
        - in: query
          name: anchorHash
          schema:
            type: string
          description: With anchorSequence, also checks that the saved head still exists. This is what detects removed tail events.
      responses:
        "200":
          description: Hash-chain verification result
components:
  parameters:
    RequestId:
      in: path
      name: requestId
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ToolRequest:
      type: object
      required: [actorId, toolId, action, resource]
      properties:
        actorId:
          type: string
        actorType:
          type: string
          default: ai-agent
        toolId:
          type: string
        action:
          type: string
        resource:
          type: string
        environment:
          type: string
        dataClassification:
          type: string
          enum: [public, internal, confidential, restricted]
        requestedScopes:
          type: array
          items:
            type: string
        existingScopes:
          type: array
          items:
            type: string
        justification:
          type: string
        context:
          type: string
    HumanDecision:
      type: object
      required: [reviewerId, reviewerRole, decision, reason]
      properties:
        reviewerId:
          type: string
        reviewerRole:
          type: string
          enum: [resource-owner, security-analyst, security-lead]
        decision:
          type: string
          enum: [approve, deny]
        reason:
          type: string
          minLength: 12
