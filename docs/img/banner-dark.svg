<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
<title id="t">MCP Human Approval Gateway</title>
<desc id="d">A tool call from an AI agent passes the policy check, waits for a named person to approve that exact request, gets a permit that can be used once and expires, and every decision is written to a hash-chained log. 210 scripted checks.</desc>
<style>.pkt{offset-path:path("M120 228 H1080");animation:pkt 6.0s linear .5s 3 both}@keyframes pkt{0%{offset-distance:0%;opacity:0}4%{opacity:1}50%{offset-distance:52.1%}66%{offset-distance:52.1%}96%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}.gate{transform-box:fill-box;transform-origin:center;animation:gate 6.0s ease-out .5s 3 both}@keyframes gate{0%,48%{transform:scale(1);opacity:.16}56%{transform:scale(1.6);opacity:.4}66%,100%{transform:scale(1);opacity:.16}}.ok{animation:ok 6.0s ease-out .5s 3 both}@keyframes ok{0%,60%{opacity:0}66%,100%{opacity:1}}@media (prefers-reduced-motion: reduce){.pkt{display:none}.gate,.ok{animation:none}.ok{opacity:1}}</style>
<rect width="1200" height="320" rx="18" fill="#05061a"/>
<rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#1f2a40"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<text x="56" y="64" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3" fill="#4de2ff">MODEL CONTEXT PROTOCOL · HTTP AND STDIO · 210 CHECKS</text>
<text x="56" y="118" font-size="46" font-weight="800" fill="#e8eefc">MCP Human Approval Gateway</text>
<text x="56" y="154" font-size="20" fill="#a9b6d3">When an AI agent wants to do something risky, a named person says yes, and you can prove it later.</text>
<line x1="120" y1="228" x2="1080" y2="228" stroke="#1f2a40" stroke-width="3" stroke-linecap="round"/>
<circle cx="120" cy="228" r="11" fill="#05061a" stroke="#4de2ff" stroke-width="3"/>
<text x="120" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#e8eefc">AI agent</text>
<text x="120" y="294" text-anchor="middle" font-size="14" fill="#a9b6d3">tool call</text>
<circle cx="370" cy="228" r="11" fill="#05061a" stroke="#4de2ff" stroke-width="3"/>
<text x="370" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#e8eefc">Policy</text>
<text x="370" y="294" text-anchor="middle" font-size="14" fill="#a9b6d3">risk and scope</text>
<circle class="gate" cx="620" cy="228" r="22" fill="#f7c873" fill-opacity="1" opacity=".16"/>
<circle cx="620" cy="228" r="11" fill="#05061a" stroke="#f7c873" stroke-width="3"/>
<text x="620" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#f7c873">A person</text>
<text x="620" y="294" text-anchor="middle" font-size="14" fill="#a9b6d3">approves this request</text>
<circle cx="870" cy="228" r="11" fill="#05061a" stroke="#34d399" stroke-width="3"/>
<text x="870" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#e8eefc">Permit</text>
<text x="870" y="294" text-anchor="middle" font-size="14" fill="#a9b6d3">once, then expires</text>
<circle cx="1080" cy="228" r="11" fill="#05061a" stroke="#a78bfa" stroke-width="3"/>
<text x="1080" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#e8eefc">Audit log</text>
<text x="1080" y="294" text-anchor="middle" font-size="14" fill="#a9b6d3">hash-chained</text>
<g class="ok"><rect x="574" y="170" width="92" height="28" rx="14" fill="#0b1230" stroke="#34d399"/><text x="620" y="189" text-anchor="middle" font-size="14" font-weight="700" fill="#34d399">approved</text></g>
<circle class="pkt" cx="0" cy="0" r="6.5" fill="#4de2ff"/>
</g>
</svg>
